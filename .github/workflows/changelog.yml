name: changelog

# The /changelog page is built from CHANGELOG.md (scripts/build-changelog.py): no git history, no GitHub, no network.
# The deploy builds storage/app/changelog.json (update.sh); resources/changelog.json is the committed fallback.
# This job proves the file is written for readers (plain words, a place for every item) and that the committed
# snapshot is the one the builder makes from it.
on:
  pull_request:
    branches: [main]
    paths:
      - CHANGELOG.md
      - scripts/build-changelog.py
      - scripts/test_build_changelog.py
      - app/Http/Controllers/ChangelogController.php
      - resources/changelog.json
      - .github/workflows/changelog.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Changelog is plain and current
        run: python3 scripts/build-changelog.py --repo BioHop --check && python3 -m unittest scripts/test_build_changelog.py
