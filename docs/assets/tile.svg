<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="tile-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="tile-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#581c87"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="tile-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow ellipse -->
  <ellipse cx="110" cy="242" rx="78" ry="14" fill="#000000" opacity="0.28"/>

  <!-- 3D tile: side + top + front face -->
  <g>
    <!-- right side (depth) -->
    <path d="M178 38 L206 60 L206 212 L178 190 Z" fill="url(#tile-side)"/>
    <!-- bottom side -->
    <path d="M42 190 L70 212 L206 212 L178 190 Z" fill="url(#tile-side)"/>
    <!-- top side -->
    <path d="M42 38 L70 16 L206 38 L178 60 Z" fill="url(#tile-top)"/>
    <!-- front face -->
    <rect x="42" y="38" width="136" height="152" rx="14" fill="url(#tile-face)"/>
    <rect x="42" y="38" width="136" height="152" rx="14" fill="url(#tile-glow)"/>

    <!-- card content: avatar + link rows -->
    <circle cx="110" cy="76" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="103" cy="73" r="4.6" fill="#a855f7"/>
    <circle cx="117" cy="73" r="4.6" fill="#a855f7"/>
    <path d="M101 82 Q110 90 119 82" stroke="#a855f7" stroke-width="3" fill="none" stroke-linecap="round"/>

    <rect x="70" y="104" width="80" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="62" y="126" width="96" height="13" rx="6.5" fill="#ffffff" opacity="0.75"/>
    <rect x="62" y="147" width="96" height="13" rx="6.5" fill="#ffffff" opacity="0.6"/>
    <rect x="62" y="168" width="70" height="13" rx="6.5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- floating QR chip -->
  <g transform="translate(6, 116)">
    <rect x="0" y="0" width="52" height="52" rx="11" fill="#ffffff" opacity="0.97"/>
    <g fill="#1c1c27">
      <rect x="8" y="8" width="13" height="13" rx="3"/>
      <rect x="31" y="8" width="13" height="13" rx="3"/>
      <rect x="8" y="31" width="13" height="13" rx="3"/>
      <rect x="26" y="26" width="6" height="6" rx="1.5"/>
      <rect x="34" y="31" width="5" height="5" rx="1.5"/>
      <rect x="31" y="38" width="5" height="5" rx="1.5"/>
      <rect x="38" y="25" width="4" height="4" rx="1.5"/>
    </g>
  </g>

  <!-- floating click-stats chip -->
  <g transform="translate(152, 22)">
    <rect x="0" y="0" width="60" height="40" rx="10" fill="#ffffff" opacity="0.97"/>
    <g fill="#d946ef">
      <rect x="10" y="24" width="7" height="8" rx="2"/>
      <rect x="21" y="17" width="7" height="15" rx="2"/>
      <rect x="32" y="10" width="7" height="22" rx="2"/>
    </g>
  </g>
</svg>
