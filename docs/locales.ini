run_signin_h = Configuración de inicio de sesión
run_signin = El inicio de sesión usa el inicio de sesión único de HOP ID. Define HOP_HUB_URL, HOP_APP=biohop y el secreto SSO específico de la app o compartido (32+ caracteres) en tu .env antes de iniciar sesión.
run_db_h = Base de datos
run_db = BioHop está diseñado para compartir una base de datos MySQL con el hub y LinkHop, escribiendo sus tablas en el registro migrations_bio. Ejecuta primero las migraciones del hub para que existan tablas compartidas como users. La compatibilidad real de las migraciones no ha sido verificada por esta documentación.
