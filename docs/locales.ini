theme_btn_light = Светлая тема
kicker = Ссылка-в-профиле
h1 = Ваши ссылки на одной странице — публикация за секунды
lede = BioHop превращает одну страницу в ваш дом в интернете: ссылки, встроенный контент, соцсети и QR-код на hel.ink/b/{slug}, управление с bio.hel.ink. Самостоятельное размещение, открытый код, часть семейства HOP.
cta_main = Попробовать BioHop
cta_code = Посмотреть код
hero_note = Действующие адреса на этой странице ведут на публичные сайты семейства HOP.
features_h = Что делает BioHop
f1_t = Публичные bio-страницы с QR и учётом кликов
f1_d = Каждая страница живёт на hel.ink/b/{slug}, имеет свой QR-код и фиксирует клики по вашим ссылкам.
f2_t = Полноценный редактор на /bio
f2_d = Управляйте страницами и ссылками, загружайте изображения, аватары, значки и логотипы для QR, смотрите живой предпросмотр, дублируйте страницы и изучайте статистику по каждой странице.
f3_t = Готовые темы
f3_d = Светлая, тёмная, минималистичная, неоновая и многие другие темы — общие для редактора, его предпросмотра и публичной страницы.
f4_t = Один вход для всех приложений: HOP ID
f4_d = Здесь нет локальной регистрации или паролей. Вы один раз входите с HOP ID на хабе. Перед входом настройте HOP_HUB_URL, HOP_APP и SSO-секрет.
f5_t = Аналитика кликов
f5_d = Страна (GeoIP), а также определение устройства, браузера и ботов для каждого клика.
f6_t = Сокращение ссылок через LinkHop
f6_d = Кнопка «Сократить эту ссылку» в блоках обращается к API LinkHop с вашим собственным сервисным токеном. Если LinkHop недоступен, блок сохраняет исходную ссылку.
f7_t = Безопасность ссылок и контента
f7_d = Команда abuse:scan по часовому расписанию проверяет страницы и блоки по общему domain_blacklist из hop/safety.
f8_t = Ежедневная очистка данных
f8_d = Команда privacy:prune удаляет данные о кликах по bio каждый день, поэтому аналитика не накапливается бесконечно.
run_h = Запустить у себя
run_intro = BioHop можно разместить у себя. Эти шаги описаны по документации репозитория; при написании этой страницы они не выполнялись.
run_req_h = Требования
run_req = PHP 8.3, Composer и Node 20+. Полные команды быстрого старта и тестов — в README на GitHub.
run_signin_h = Настройка входа
run_signin = Вход использует единый вход HOP ID. Перед входом задайте в .env значения HOP_HUB_URL, HOP_APP=biohop и SSO-секрет (отдельный для приложения или общий, 32+ символов).
run_db_h = База данных
run_db = BioHop спроектирован так, чтобы делить одну базу данных MySQL с хабом и LinkHop, записывая свои таблицы в журнал migrations_bio. Сначала выполните миграции хаба, чтобы появились общие таблицы вроде users. Фактическая совместимость миграций этой документацией не проверялась.
run_note = Указанные детали базы данных — задокументированный замысел, а не проверенная гарантия.
faq_h = Частые вопросы
q1 = Какие данные записывает клик?
a1 = Клик записывает время, ссылку, а также производные данные о стране, устройстве и браузере. BioHop ежедневно очищает данные о кликах по bio командой privacy:prune.
q2 = Нужно ли регистрировать аккаунт?
a2 = Нет. В BioHop нет локальной регистрации и паролей: вы один раз входите с HOP ID на хабе и пользуетесь всеми приложениями HOP.
q3 = Можно ли разместить у себя?
a3 = Да. BioHop — открытый код под лицензией MIT. Требования и быстрый старт — в README на GitHub; URL хаба, имя приложения и SSO-секрет вы настраиваете сами.
q4 = Где сообщить о проблеме?
a4 = Создайте issue на GitHub.
