h1 = Vos liens, une page, publiés en quelques secondes
lede = BioHop transforme une seule page en votre chez-vous sur le web : liens, contenus intégrés, réseaux sociaux et un code QR sur hel.ink/b/{slug}, gérés depuis bio.hel.ink. Auto-hébergeable, open source, membre de la famille HOP.
