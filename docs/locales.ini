theme_btn_dark = Tema escuro
theme_btn_light = Tema claro
kicker = Link-in-bio
h1 = Seus links, uma página, publicados em segundos
lede = O BioHop transforma uma única página em seu lar na web: links, conteúdo incorporado, redes sociais e um código QR em hel.ink/b/{slug}, gerenciados pelo bio.hel.ink. Auto-hospedável, de código aberto e parte da família HOP.
cta_main = Experimentar o BioHop
cta_code = Ver o código
hero_note = Os endereços ao vivo desta página apontam para os sites públicos da família HOP.
features_h = O que o BioHop faz
f1_t = Páginas bio públicas com QR e rastreamento de cliques
f1_d = Cada página vive em hel.ink/b/{slug}, tem seu próprio código QR e registra quando as pessoas clicam nos seus links.
f2_t = Um editor completo em /bio
f2_d = Gerencie páginas e links, envie imagens, avatares, ícones e logotipos de QR, veja uma pré-visualização ao vivo, duplique páginas e acompanhe análises por página.
f3_t = Temas predefinidos
f3_d = Temas claro, escuro, minimalista, neon e muitos outros, compartilhados pelo editor, pela pré-visualização e pela página pública.
f4_t = Um login para todos os apps: HOP ID
f4_d = Aqui não há cadastro local nem senhas. Você entra uma vez com seu HOP ID no hub. Configure HOP_HUB_URL, HOP_APP e o segredo SSO antes de entrar.
f5_t = Análises de cliques
f5_d = País (GeoIP) além de detecção de dispositivo, navegador e bots para cada clique.
f6_t = Encurte links com o LinkHop
f6_d = “Encurtar esta URL” nos blocos chama a API do LinkHop com seu próprio token de serviço. Se o LinkHop estiver fora do ar, o bloco mantém a URL original.
f7_t = Segurança de URL e conteúdo
f7_d = O comando abuse:scan verifica páginas e blocos contra o domain_blacklist compartilhado do hop/safety, em agendamento horário.
f8_t = Limpeza diária de privacidade
f8_d = O comando privacy:prune exclui diariamente os dados de cliques bio, para que as análises não se acumulem para sempre.
run_h = Execute você mesmo
run_intro = O BioHop pode ser auto-hospedado. Estes passos estão documentados a partir do repositório; não foram executados na elaboração desta página.
run_req_h = Pré-requisitos
run_req = PHP 8.3, Composer e Node 20+. Os comandos completos de início rápido e testes estão no README no GitHub.
run_signin_h = Configuração de login
run_signin = O login usa o login único do HOP ID. Defina HOP_HUB_URL, HOP_APP=biohop e o segredo SSO específico do app ou compartilhado (32+ caracteres) no seu .env antes de entrar.
run_db_h = Banco de dados
run_db = O BioHop é projetado para compartilhar um banco de dados MySQL com o hub e o LinkHop, gravando suas tabelas no registro migrations_bio. Execute as migrações do hub primeiro para que tabelas compartilhadas como users existam. A compatibilidade real das migrações não foi verificada por esta documentação.
run_note = Os detalhes de banco de dados acima são design documentado, não uma garantia testada.
faq_h = Perguntas frequentes
q1 = Quais dados um clique registra?
a1 = Um clique registra o momento, o link e detalhes derivados de país, dispositivo e navegador. O BioHop limpa diariamente os dados de cliques bio com privacy:prune.
q2 = Preciso criar uma conta?
a2 = Não. Não há cadastro local nem senhas no BioHop: você entra com seu HOP ID no hub, uma única vez, e usa todos os apps HOP.
q3 = Posso hospedar eu mesmo?
a3 = Sim. O BioHop é de código aberto sob a licença MIT. Veja o README no GitHub para pré-requisitos e início rápido; você configura sua própria URL do hub, nome do app e segredo SSO.
q4 = Onde reporto um problema?
a4 = Abra uma issue no GitHub.
