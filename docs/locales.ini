f4_d = لا تسجيل محلي ولا كلمات مرور هنا. تسجّل الدخول مرة واحدة بمعرّف HOP ID في المحور. اضبط HOP_HUB_URL وHOP_APP وسر SSO قبل تسجيل الدخول.
f5_t = تحليلات النقرات
f5_d = الدولة (GeoIP) مع كشف الجهاز والمتصفح والروبوتات لكل نقرة.
f6_t = اختصر الروابط مع LinkHop
f6_d = خيار «اختصر هذا الرابط» في الكتل يستدعي واجهة LinkHop البرمجية برمز خدمتك الخاص. وإذا تعطّل LinkHop، يحتفظ الكتلة برابطها الأصلي.
f7_t = أمان الروابط والمحتوى
f7_d = يفحص أمر abuse:scan الصفحات والكتل مقابل القائمة السوداء المشتركة domain_blacklist من hop/safety، وفق جدول ساعي.
f8_t = تنظيف خصوصي يومي
f8_d = يحذف أمر privacy:prune بيانات نقرات bio كل يوم، فلا تتراكم التحليلات إلى الأبد.
run_h = شغّلها بنفسك
run_intro = يمكن استضافة BioHop ذاتيًا. هذه الخطوات موثّقة من المستودع؛ ولم تُنفَّذ أثناء كتابة هذه الصفحة.
run_req_h = المتطلبات
run_req = ‏PHP 8.3 وComposer وNode 20+. أوامر البدء السريع والاختبار الكاملة في README على GitHub.
run_signin_h = إعدادات تسجيل الدخول
run_signin = يستخدم تسجيل الدخول الدخول الموحّد عبر HOP ID. اضبط HOP_HUB_URL وHOP_APP=biohop وسر SSO الخاص بالتطبيق أو المشترك (32+ محرفًا) في ملف .env قبل تسجيل الدخول.
run_db_h = قاعدة البيانات
run_db = صُمّم BioHop ليشارك قاعدة بيانات MySQL واحدة مع المحور وLinkHop، ويكتب جداوله في سجل migrations_bio. شغّل ترحيلات المحور أولًا لتوجد الجداول المشتركة مثل users. لم يتحقّق هذا التوثيق من توافق الترحيلات الفعلي.
run_note = تفاصيل قاعدة البيانات أعلاه تصميم موثّق، لا ضمان مُختبَر.
faq_h = الأسئلة الشائعة
q1 = ما البيانات التي تسجّلها النقرة؟
a1 = تسجّل النقرة التوقيت والرابط وتفاصيل مشتقة عن الدولة والجهاز والمتصفح. ينظّف BioHop بيانات نقرات bio يوميًا بأمر privacy:prune.
q2 = هل أحتاج إلى إنشاء حساب؟
a2 = لا. لا يوجد تسجيل محلي ولا كلمات مرور في BioHop: تسجّل الدخول بمعرّف HOP ID في المحور مرة واحدة وتستخدم كل تطبيقات HOP.
q3 = هل يمكنني استضافته بنفسي؟
a3 = نعم. BioHop مفتوح المصدر برخصة MIT. راجع README على GitHub للمتطلبات وخطوات البدء السريع؛ وتضبط أنت عنوان المحور واسم التطبيق وسر SSO.
q4 = أين أبلّغ عن مشكلة؟
a4 = افتح issue على GitHub.
