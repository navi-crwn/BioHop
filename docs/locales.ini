# Content strings for BioHop static documentation pages.
# Each block maps 1:1 to the placeholders in docs/.template.html.
# Canonical English comes from biohop-persiapan/KONTRAK-KONTEN.md (features F1-F8,
# family table). Translations may adapt grammar but must not add claims.

[en]
dir = ltr
native = English
page_title = BioHop — Link-in-bio pages for the HOP family
page_desc = One page with your links, embeds, socials and a QR code, published at hel.ink/b/{slug} and managed at bio.hel.ink. Self-hostable and open source (MIT).
og_title = BioHop — Link-in-bio pages for the HOP family
skip = Skip to content
nav_label = Page navigation
nav_features = Features
nav_run = Run your own
nav_faq = FAQ
nav_family = HOP family
theme_btn_dark = Dark theme
theme_btn_light = Light theme
kicker = Link-in-bio
h1 = Your links, one page, published in seconds
lede = BioHop turns a single page into your home on the web: links, embeds, socials and a QR code at hel.ink/b/{slug}, managed from bio.hel.ink. Self-hostable, open source, part of the HOP family.
cta_main = Try BioHop
cta_code = View the code
hero_note = Live addresses in this page link to the HOP family’s public sites.
features_h = What BioHop does
f1_t = Public bio pages with QR and click tracking
f1_d = Every page lives at hel.ink/b/{slug}, comes with its own QR code, and records when people click your links.
f2_t = A full editor at /bio
f2_d = Manage pages and links, upload images, avatars, icons and QR logos, watch a live preview, duplicate pages and read per-page analytics.
f3_t = Theme presets
f3_d = Light, dark, minimal, neon and many more presets, shared by the editor, its preview and the public page.
f4_t = One sign-in for every app: HOP ID
f4_d = No local sign-up or passwords here. You sign in once with your HOP ID at the hub. Configure HOP_HUB_URL, HOP_APP and the SSO secret before sign-in.
f5_t = Click analytics
f5_d = Country (GeoIP) plus device, browser and bot detection for every click.
f6_t = Shorten links with LinkHop
f6_d = “Shorten this URL” in blocks calls LinkHop’s API with your own service token. If LinkHop is down, the block keeps its original URL.
f7_t = URL and content safety
f7_d = The abuse:scan command checks pages and blocks against the shared domain_blacklist from hop/safety, on an hourly schedule.
f8_t = Daily privacy pruning
f8_d = The privacy:prune command deletes bio click data every day, so analytics don’t pile up forever.
run_h = Run your own
run_intro = BioHop is self-hostable. These steps are documented from the repository; they have not been executed as part of writing this page.
run_req_h = Prerequisites
run_req = PHP 8.3, Composer and Node 20+. The full quickstart and test commands are in the README on GitHub.
run_signin_h = Sign-in configuration
run_signin = Sign-in uses HOP ID single sign-on. Set HOP_HUB_URL, HOP_APP=biohop and the app-specific or shared SSO secret (32+ characters) in your .env before signing in.
run_db_h = Database
run_db = BioHop is designed to share one MySQL database with the hub and LinkHop, writing its own tables to the migrations_bio log. Run the hub’s migrations first so shared tables like users exist. Actual migration compatibility has not been verified by this documentation.
run_note = The database details above are documented design, not a tested guarantee.
faq_h = FAQ
q1 = What data does a click record?
a1 = A click records timing, the link, and derived country, device and browser details. BioHop prunes bio click data daily with privacy:prune.
q2 = Do I need to register an account?
a2 = No. There is no local sign-up or password on BioHop: you sign in with your HOP ID at the hub, once, and use every HOP app.
q3 = Can I self-host it?
a3 = Yes. BioHop is open source under the MIT license. See the README on GitHub for prerequisites and the quickstart; you configure your own hub URL, app name and SSO secret.
q4 = Where do I report a problem?
a4 = Please open an issue on GitHub.
family_h = The HOP family
family_intro = BioHop is part of the HOP family of self-hostable open-source apps behind hel.ink.
th_app = App
th_what = What it does
th_live = Live address
th_code = Code
hub_what = Account portal, HOP ID sign-in
linkhop_what = URL shortener
biohop_what = Link-in-bio pages
pixelhop_what = Image &amp; media hosting
notehop_what = Private notes and documents
planned = planned
this_repo = this repo
help_h = Help &amp; issues
help_text = Found a bug or something unclear in this documentation?
help_issues = Open an issue on GitHub
help_tail = .
footer_tag = Link-in-bio pages for the HOP family
footer_license = License:
