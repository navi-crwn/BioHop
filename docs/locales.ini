run_signin_h = Configuration de la connexion
run_signin = La connexion utilise l’authentification unique HOP ID. Définissez HOP_HUB_URL, HOP_APP=biohop et le secret SSO propre à l’appli ou partagé (32+ caractères) dans votre .env avant de vous connecter.
run_db_h = Base de données
run_db = BioHop est conçu pour partager une base de données MySQL avec le hub et LinkHop, en écrivant ses propres tables dans le journal migrations_bio. Exécutez d’abord les migrations du hub pour que les tables partagées comme users existent. La compatibilité réelle des migrations n’a pas été vérifiée par cette documentation.
run_note = Les détails de base de données ci-dessus sont un design documenté, pas une garantie testée.
faq_h = FAQ
q1 = Quelles données un clic enregistre-t-il ?
a1 = Un clic enregistre l’horodatage, le lien, ainsi que le pays, l’appareil et le navigateur déduits. BioHop purge chaque jour les données de clics bio avec privacy:prune.
q2 = Dois-je créer un compte ?
a2 = Non. BioHop n’a pas d’inscription locale ni de mot de passe : vous vous connectez avec votre HOP ID sur le hub, une seule fois, puis vous utilisez toutes les applis HOP.
q3 = Puis-je l’héberger moi-même ?
a3 = Oui. BioHop est open source sous licence MIT. Consultez le README sur GitHub pour les prérequis et le démarrage rapide ; vous configurez vous-même l’URL du hub, le nom de l’appli et le secret SSO.
