f1_d = Cada página vive en hel.ink/b/{slug}, incluye su propio código QR y registra cuándo la gente hace clic en tus enlaces.
f2_t = Un editor completo en /bio
f2_d = Gestiona páginas y enlaces, sube imágenes, avatares, iconos y logotipos para el QR, mira una vista previa en vivo, duplica páginas y consulta analíticas por página.
