h1 = あなたのリンクを 1 ページに、数秒で公開
lede = BioHop は 1 ページをウェブ上のあなたの居場所にします。リンク・埋め込み・SNS・QR コードを hel.ink/b/{slug} に公開し、bio.hel.ink から管理。セルフホスト可能なオープンソースで、HOP ファミリーの一員です。
cta_main = BioHop を試す
cta_code = コードを見る
hero_note = このページのライブアドレスは HOP ファミリーの公開サイトへつながります。
features_h = BioHop にできること
f1_t = QR コードとクリック計測付きの公開 bio ページ
f1_d = 各ページは hel.ink/b/{slug} にあり、専用の QR コードを添え、リンクがクリックされた記録を残します。
f2_t = /bio のフルエディター
f2_d = ページやリンクを管理し、画像・アバター・アイコン・QR ロゴをアップロード。ライブプレビュー、ページ複製、ページ別アナリティクスに対応。
f3_t = テーマプリセット
f3_d = ライト、ダーク、ミニマル、ネオンなど多数のプリセットを、エディター・プレビュー・公開ページで共有。
f4_t = すべてのアプリで一度のサインイン：HOP ID
f4_d = ローカル登録もパスワードもありません。ハブで HOP ID によるサインインを一度行うだけ。サインイン前に HOP_HUB_URL、HOP_APP、SSO シークレットを設定してください。
f5_t = クリックアナリティクス
f5_d = クリックごとに国（GeoIP）とデバイス・ブラウザー・ボット判定を記録。
f6_t = LinkHop でリンクを短縮
f6_d = ブロックの「この URL を短縮」は、あなた自身のサービストークンで LinkHop の API を呼び出します。LinkHop が停止していても、ブロックは元の URL を保持します。
f7_t = URL とコンテンツの安全性
f7_d = abuse:scan コマンドが 1 時間ごとのスケジュールで、hop/safety の共有 domain_blacklist に基づきページとブロックを検査します。
f8_t = 毎日のプライバシー削除
f8_d = privacy:prune コマンドが毎日 bio のクリックデータを削除するため、アナリティクスは無限に蓄積しません。
run_h = 自分で動かす
run_intro = BioHop はセルフホストできます。以下の手順はリポジトリの文書に基づくもので、このページの作成時に実行されたものではありません。
run_req_h = 前提条件
run_req = PHP 8.3、Composer、Node 20+。クイックスタートとテストのコマンド一式は GitHub の README を参照。
run_signin_h = サインインの設定
run_signin = サインインは HOP ID のシングルサインオンを使用します。サインイン前に .env に HOP_HUB_URL、HOP_APP=biohop、およびアプリ固有または共有の SSO シークレット（32 文字以上）を設定してください。
run_db_h = データベース
run_db = BioHop はハブおよび LinkHop と 1 つの MySQL データベースを共有する設計で、自身のテーブルを migrations_bio ログに記録します。users などの共有テーブルを確保するため、まずハブのマイグレーションを実行してください。実際のマイグレーション互換性はこのドキュメントでは検証されていません。
run_note = 上記のデータベースの詳細は文書化された設計であり、検証済みの保証ではありません。
faq_h = よくある質問
q1 = クリックでは何が記録されますか？
a1 = クリックの日時、リンクに加え、国・デバイス・ブラウザーの判定結果が記録されます。BioHop は privacy:prune により bio のクリックデータを毎日削除します。
q2 = アカウント登録は必要ですか？
a2 = 必要ありません。BioHop にローカル登録やパスワードはありません。ハブで HOP ID によるサインインを一度すれば、すべての HOP アプリを利用できます。
q3 = セルフホストできますか？
a3 = できます。BioHop は MIT ライセンスのオープンソースです。前提条件とクイックスタートは GitHub の README を参照。ハブ URL・アプリ名・SSO シークレットは各自で設定します。
q4 = 問題はどこで報告しますか？
a4 = GitHub で issue を開いてください。
