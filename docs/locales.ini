[pt]
dir = ltr
native = Português
page_title = BioHop — Páginas link-in-bio para a família HOP
page_desc = Uma página com seus links, conteúdo incorporado, redes sociais e um código QR, publicada em hel.ink/b/{slug} e gerenciada em bio.hel.ink. Auto-hospedável e de código aberto (MIT).
