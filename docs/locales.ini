q2 = ¿Necesito registrarme?
a2 = No. BioHop no tiene registro local ni contraseñas: inicias sesión con tu HOP ID en el hub, una sola vez, y usas todas las apps de HOP.
q3 = ¿Puedo autoalojarlo?
a3 = Sí. BioHop es código abierto bajo la licencia MIT. Consulta el README en GitHub para los requisitos y el inicio rápido; configuras tu propia URL del hub, nombre de app y secreto SSO.
