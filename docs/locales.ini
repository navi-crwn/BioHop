f1_d = Chaque page vit sur hel.ink/b/{slug}, avec son propre code QR, et enregistre les clics sur vos liens.
f2_t = Un éditeur complet sur /bio
f2_d = Gérez pages et liens, téléversez images, avatars, icônes et logos QR, visualisez un aperçu en direct, dupliquez des pages et consultez des statistiques par page.
f3_t = Thèmes prédéfinis
f3_d = Thèmes clair, sombre, minimal, néon et bien d’autres, partagés par l’éditeur, son aperçu et la page publique.
f4_t = Une seule connexion pour toutes les applis : HOP ID
f4_d = Pas d’inscription locale ni de mot de passe ici. Vous vous connectez une fois avec votre HOP ID sur le hub. Configurez HOP_HUB_URL, HOP_APP et le secret SSO avant de vous connecter.
